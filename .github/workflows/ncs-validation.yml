name: NCS frozen Windows lifecycle validation
on:
  push:
    branches: ['codex/ncs-platform-validation-*']
permissions:
  contents: read
  actions: read
jobs:
  frozen:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ncs-validation-windows-2025
          run-id: 42670094802
          github-token: ${{ github.token }}
          path: retrieved
      - name: Extract exact previously built executable
        shell: pwsh
        run: Expand-Archive -Path retrieved/dist/desktop/Notion-Calendar-Sync-0.2.1-Windows-native-x64.zip -DestinationPath frozen
      - name: Native frozen window and crash recovery
        shell: pwsh
        run: ./check-frozen-windows.ps1 -Executable 'frozen/Notion Calendar Sync/Notion Calendar Sync.exe' -Output frozen-windows.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncs-frozen-windows-lifecycle
          path: frozen-windows.json
